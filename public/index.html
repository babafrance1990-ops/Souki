<style>
/* Layout: one phone-sized app column, full screen on a phone, centered frame on a computer */
:root{
  --bg:#F7F3EA; --surface:#FFFFFF; --line:#E6DFCF; --ph:#E9E2D2;
  --fg:#1C2A22; --muted:#56625A; --brand:#0B6B3A; --brand-fg:#FFFFFF;
  --gold:#F2B632; --gold-fg:#1C2A22; --tint:#EEF5F0; --warn-bg:#FDF3DC; --warn-fg:#5B4210;
  --danger:#9A3412; --wa:#1E7A45; --outer:#E4DCCB;
  --font:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121A15; --surface:#1B261F; --line:#2C3A31; --ph:#26342B;
  --fg:#EAF1EC; --muted:#A3B2A8; --brand:#2E9E62; --brand-fg:#FFFFFF;
  --gold:#F2B632; --gold-fg:#1C2A22; --tint:#1E3327; --warn-bg:#3A2F14; --warn-fg:#F5DFA6;
  --danger:#F08A5D; --wa:#2E9E62; --outer:#0B100D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121A15; --surface:#1B261F; --line:#2C3A31; --ph:#26342B;
  --fg:#EAF1EC; --muted:#A3B2A8; --brand:#2E9E62; --brand-fg:#FFFFFF;
  --gold:#F2B632; --gold-fg:#1C2A22; --tint:#1E3327; --warn-bg:#3A2F14; --warn-fg:#F5DFA6;
  --danger:#F08A5D; --wa:#2E9E62; --outer:#0B100D; color-scheme:dark}
html,body{height:100%;margin:0;padding:0}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}

body{background:var(--outer);color:var(--fg);font-family:var(--font);font-size:15px}
*{box-sizing:border-box}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:440px;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative}
@media (min-width:600px){.app{height:calc(100% - 32px);margin-top:16px;border-radius:28px;box-shadow:0 10px 40px rgba(0,0,0,.18)}}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.hdr{position:relative;z-index:12;background:var(--brand);color:var(--brand-fg);padding:10px 14px 12px;border-radius:0 0 20px 20px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.logo{font-size:22px;font-weight:800;letter-spacing:-.5px;white-space:nowrap;flex-shrink:0}
.logo span{color:var(--gold)}
.pill{height:36px;padding:0 12px;border-radius:18px;border:1px solid rgba(255,255,255,.5);background:transparent;color:inherit;font-weight:700;font-size:14px}
.searchbox{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:14px;background:var(--surface);color:var(--muted)}
.searchbox input{flex:1;min-width:0;border:none;outline:none;background:transparent;color:var(--fg)}
.hsel{max-width:150px;min-width:0;width:100%;height:34px;border-radius:17px;border:none;padding:0 10px;background:rgba(255,255,255,.18);color:var(--brand-fg);font-weight:600;font-size:16px}
.hsel option,.hsel optgroup{color:#1C2A22}
.sec{padding:16px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:21px;line-height:1.3;text-wrap:balance}
h2{margin:0;font-size:17px;font-weight:700}
.cattiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px 4px}
.vbadge{color:var(--brand);font-weight:700;display:flex;align-items:center;gap:3px}
.flags{display:flex;gap:4px;flex-wrap:wrap}
.flag{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:1px 6px;border-radius:8px;background:var(--tint);color:var(--brand)}
.ecoph{position:absolute;bottom:6px;inset-inline-end:6px;background:rgba(28,42,34,.72);color:#fff;border-radius:8px;padding:3px 5px;display:flex}
.tabband{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:14px;border:none;background:var(--gold);color:var(--gold-fg);font-weight:800;font-size:14px;text-align:start;width:100%}
.tabgo{font-size:13px;text-decoration:underline;flex-shrink:0;display:flex}
.tabband[aria-pressed="false"]{background:var(--warn-bg);color:var(--warn-fg)}
.tabband[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--gold-fg)}
.filters .flabel{font-size:12px;font-weight:700;color:var(--muted)}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchips .chip{height:36px;font-size:13px;padding:0 12px}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);color:var(--fg);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.22);z-index:15;padding:6px;display:flex;flex-direction:column;max-height:320px;overflow-y:auto}
.sgsub{display:block;font-size:12px;color:var(--muted);font-weight:600}
.sghead{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;font-size:12px;font-weight:700;color:var(--muted)}
.sgrow{display:flex;align-items:center;gap:10px;min-height:44px;padding-block:4px;padding:0 8px;border:none;background:none;border-radius:10px;text-align:start;font-size:15px;color:var(--fg);width:100%}
.sgrow>span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sgrow:hover,.sgrow:focus-visible{background:var(--tint)}
.actrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:0 2px}
.fbtn{flex-shrink:0;height:34px;padding:0 12px;border-radius:17px;border:none;background:var(--surface);color:var(--brand);font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px}
.achip{flex-shrink:0;height:34px;padding:0 10px 0 12px;border-radius:17px;border:none;background:rgba(255,255,255,.18);color:var(--brand-fg);font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.achip.clear{background:transparent;text-decoration:underline;padding:0 6px}
.sheet.fsheet{max-height:88%;padding-bottom:16px}
.sheet.fsheet.again{animation:none}
.fsbody{overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding-bottom:4px}
.linkbtn.showcats{color:var(--brand);align-self:flex-start;display:flex;align-items:center;gap:6px;color:var(--brand);text-decoration:none;font-weight:800;font-size:14px}
[hidden]{display:none!important}
.sharewa{border-color:var(--wa);color:var(--wa);text-decoration:none}
.conv{display:flex;gap:12px;align-items:center;padding:10px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:start;width:100%}
.cthumb{width:56px;height:56px;aspect-ratio:auto;border-radius:12px;flex-shrink:0}
.cthumb .tag,.cthumb .ecoph{display:none}
.cthumb svg{width:28px;height:28px}
.cmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.cname{font-size:15px}
.ctitle1,.cprev{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cprev{font-size:14px;color:var(--muted)}
.cprev.unread{color:var(--fg);font-weight:800}
.ubadge{min-width:22px;height:22px;border-radius:11px;background:var(--brand);color:var(--brand-fg);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 6px;flex-shrink:0}
.adrow{display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--surface);border:none;border-bottom:1px solid var(--line);width:100%}
.adrow .cthumb{width:44px;height:44px}
.bub{max-width:80%;padding:8px 12px 18px;border-radius:16px;line-height:1.45;position:relative;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere;min-width:64px}
.bub.me{align-self:flex-end;background:var(--brand);color:var(--brand-fg);border-end-end-radius:4px}
.bub.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-end-start-radius:4px}
.btime{position:absolute;bottom:3px;inset-inline-end:10px;font-size:10px;opacity:.75}
.chatbar{display:flex;flex-direction:column;gap:8px;padding:10px 12px 12px;background:var(--surface);border-top:1px solid var(--line)}
.fabsend{width:50px;height:50px;border-radius:25px;border:none;background:var(--brand);color:var(--brand-fg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tabic{position:relative;display:flex}
.tabbadge{position:absolute;top:-4px;inset-inline-end:-10px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{display:flex;flex-direction:column;align-items:center;padding:10px 6px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--muted);font-weight:600}
.stat b{font-size:20px;color:var(--fg);font-variant-numeric:tabular-nums}
.cnt{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.srow{display:flex;align-items:center;gap:4px;padding:4px 4px 4px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.sbtn{flex:1;min-width:0;border:none;background:none;text-align:start;padding:8px 0}
.ctile{border:none;background:none;padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;line-height:1.15;text-align:center;color:var(--fg);min-width:0;hyphens:manual}
.ctile .ic{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.ctile[aria-pressed="true"]{color:var(--brand);font-weight:800}
.ctile[aria-pressed="true"] .ic{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex-shrink:0;height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:start;padding:0}
.thumb{aspect-ratio:4/3;width:100%;max-width:100%;background:var(--ph);display:flex;align-items:center;justify-content:center;color:var(--muted);position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:8px;inset-inline-start:8px;font-size:11px;font-weight:700;padding:1px 8px;border-radius:10px;background:rgba(28,42,34,.72);color:#fff}
.tag.sold{background:var(--danger)}
.cbody{padding:8px 10px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.ctitle{font-weight:600;font-size:14px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.price{font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums}
.card .price{white-space:nowrap;overflow:hidden}
.meta{font-size:12px;color:var(--muted)}
.empty{padding:32px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
nav.tabs{position:relative;z-index:10;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px 10px}
.tab{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;min-height:48px;justify-content:flex-end}
.tab[aria-current="page"]{color:var(--brand);font-weight:800}
.fab{width:56px;height:56px;border-radius:28px;background:var(--gold);color:var(--gold-fg);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.tab.post{color:var(--fg);justify-content:flex-start;gap:3px}
.tab.post .fab{margin-top:-34px;width:66px;height:66px;border-radius:33px;box-shadow:0 3px 12px rgba(0,0,0,.22)}.fab svg{width:34px;height:34px}
.postlbl{font-size:11px;font-weight:800;line-height:1.15;text-align:center;max-width:100%}
.topbar{display:flex;align-items:center;gap:8px;padding:10px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar h1{font-size:18px;flex:1}
.icon{width:44px;height:44px;border-radius:22px;border:none;background:transparent;color:inherit;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon.solid{background:var(--surface);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.hero{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--ph);display:flex;align-items:center;justify-content:center;color:var(--muted);overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .tl{position:absolute;top:12px;inset-inline-start:12px}
.hero .tr{position:absolute;top:12px;inset-inline-end:12px;display:flex;gap:8px}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{padding:2px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600}
.box{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.avatar{width:46px;height:46px;border-radius:23px;background:var(--brand);color:var(--brand-fg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0}
.tip{display:flex;gap:10px;padding:14px;border-radius:16px;background:var(--warn-bg);color:var(--warn-fg);font-size:13px;line-height:1.5}
.tip p{margin:0}
.linkbtn{border:none;background:none;padding:0;color:var(--danger);font-weight:600;text-decoration:underline;font-size:14px;align-self:flex-start}
.bar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px 12px 12px;background:var(--surface);border-top:1px solid var(--line)}
.btn{height:50px;border-radius:14px;border:2px solid var(--brand);background:var(--surface);color:var(--brand);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px}
.btn.primary{background:var(--brand);color:var(--brand-fg)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-fg)}
.btn.small{height:36px;font-size:13px;border-radius:10px;border-width:1px}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.wide{width:100%}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.legend{font-weight:700}
.inp{height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);width:100%}
textarea.inp{height:auto;padding:12px 14px;resize:none;line-height:1.5}
.inp[aria-invalid="true"]{border-color:var(--danger);border-width:2px}
.err{color:var(--danger);font-size:13px;font-weight:600}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.photos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pslot{aspect-ratio:1;border-radius:12px;background:var(--ph);position:relative;overflow:hidden}
.pslot img{width:100%;height:100%;object-fit:cover}
.pslot button{position:absolute;top:4px;inset-inline-end:4px;width:28px;height:28px;border-radius:14px;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:1}
.addph{aspect-ratio:1;border-radius:12px;border:2px dashed var(--brand);background:var(--tint);color:var(--brand);font-weight:700;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.check{display:flex;align-items:center;gap:10px;min-height:40px}
.check input{width:22px;height:22px;accent-color:var(--brand)}
.foot{padding:12px 16px 14px;background:var(--surface);border-top:1px solid var(--line)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:4px;border-radius:14px;background:var(--ph)}
.seg button{height:40px;border:none;border-radius:10px;background:transparent;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--fg);font-weight:800}
.mine{display:flex;gap:12px;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.mine .thumb{width:84px;height:84px;aspect-ratio:auto;border-radius:12px;flex-shrink:0}
.list{display:flex;flex-direction:column;border-radius:16px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.list button{min-height:52px;padding:0 16px;border:none;border-bottom:1px solid var(--line);background:none;display:flex;align-items:center;justify-content:space-between;font-weight:600;text-align:start}
.list button:last-child{border-bottom:none}
.demo{font-size:12px;color:var(--muted);text-align:center;padding:4px 16px 0}
.code{font-size:28px;letter-spacing:10px;text-align:center;font-weight:800}
.sheet-wrap{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--surface);width:100%;border-radius:22px 22px 0 0;padding:18px 16px 20px;display:flex;flex-direction:column;gap:12px}
.sheet p{margin:0;line-height:1.5}
.quote{padding:12px;border-radius:12px;background:var(--tint);font-size:14px;line-height:1.5;user-select:all}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;text-align:center;z-index:30}
.specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.specs div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;min-width:0}
.specs span{font-size:12px;color:var(--muted)}
.specs b{font-size:15px;font-variant-numeric:tabular-nums}
.carbox{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:16px;background:var(--tint);border:1px solid var(--line)}
.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.filters .field{gap:2px}
.filters label{font-size:12px;font-weight:700;color:var(--muted)}
.filters .inp{height:42px;font-size:15px;padding:0 10px}
.sel{height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font-size:14px;font-weight:600}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.6}}}
.recdot{width:12px;height:12px;border-radius:6px;background:currentColor;animation:recb 1s infinite}@keyframes recb{50%{opacity:.25}}
.mchips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.mrow{display:flex;gap:12px;align-items:center;padding:12px 4px;border:none;border-bottom:1px solid var(--line);background:none;width:100%;text-align:start;color:inherit}
.mrow .mth{width:68px;height:68px;border-radius:12px;flex-shrink:0;overflow:hidden;background:var(--ph);display:flex;align-items:center;justify-content:center}
.mrow .mth img{width:100%;height:100%;object-fit:cover}
.mrow .mmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}

function api(method,path,body){
  var h={'content-type':'application/json'};if(TOKEN)h.authorization='Bearer '+TOKEN;
  return fetch('/api/'+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined}).then(function(r){
    return r.json().catch(function(){return {};}).then(function(d){
      if(r.status===401&&d.error==='auth'){clearSession();}
      if(!r.ok){var e=new Error(d.error||'server');e.code=d.error||'server';throw e;}return d;});});}
function refreshMine(){S.mine=S.user?S.remote.filter(function(a){return a.owner===S.user.id;}):[];}
var adsGen=0;
function loadAds(){var gen=++adsGen;
  return api('GET','ads?limit=40').then(function(d){if(gen!==adsGen)return;S.remote=d.ads||[];refreshMine();if(d.more)setTimeout(function(){loadMoreAds(gen);},300);}).catch(function(){toast(t('netErr'));});}
function loadMoreAds(gen){if(gen!==adsGen||!S.remote.length)return;var last=S.remote[S.remote.length-1].t;
  api('GET','ads?limit=200&before='+last).then(function(d){if(gen!==adsGen)return;var seen={};S.remote.forEach(function(a){seen[a.id]=1;});
    (d.ads||[]).forEach(function(a){if(!seen[a.id])S.remote.push(a);});refreshMine();
    var typing=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if(!typing&&(S.screen==='home'||S.screen==='user'||S.screen==='favs'))render(true);
    if(d.more)setTimeout(function(){loadMoreAds(gen);},400);}).catch(function(){});}

function setUser(u,merge){
  S.user={id:u.id,phone:u.phone,name:u.name,since:u.since,city:u.city||'',shop:u.shop||null,admin:!!u.admin,verified:!!u.verified,avatar:u.avatar||''};save('user',S.user);
  if(Array.isArray(u.searches)){var srv=u.searches.slice();
    if(merge){(S.searches||[]).forEach(function(x){if(!srv.some(function(y){return y.q===x.q&&y.cat===x.cat&&y.city===x.city&&y.hood===x.hood;}))srv.push(normSearch(x));});}
    S.searches=srv;save('searches',S.searches);if(merge&&srv.length!==u.searches.length)api('PUT','me',{searches:S.searches}).catch(function(){});}
  var f=(u.favs||[]).slice();

function clearSession(){TOKEN='';save('token','');S.user=null;save('user',null);S.mine=[];S.favs=[];save('favs',S.favs);S.newCreds=null;save('newCreds',null);S.searches=[];save('searches',S.searches);S.myStats=null;S.adStats=null;S.convs=S.convs.filter(function(c){return !c.srv;});}
var convSig='';
function loadConvs(){
  if(!S.user)return Promise.resolve();
  return api('GET','convs').then(function(d){
    var old={};S.convs.forEach(function(c){if(c.srv)old[c.id]=c;});
    var fresh=(d.convs||[]).map(function(c){c.srv=true;return c;});
    var sig=JSON.stringify(fresh.map(function(c){return [c.id,c.msgs.length,c.unread];}));
    fresh.forEach(function(c){
      var o=old[c.id];
      if(S.screen==='chat'&&S.convId===c.id&&c.unread){c.unread=0;api('POST','convs/'+c.id+'/read').catch(function(){});}
      else if(o&&c.msgs.length>o.msgs.length&&!c.msgs[c.msgs.length-1].me)toast(t('newMsg').replace('{n}',c.seller));
      if(o&&o.pending)o.pending.forEach(function(m){if(!c.msgs.some(function(x){return x.me&&x.txt===m.txt&&x.t>=m.t-60000;}))c.msgs.push(m);});
    });
    S.convs=S.convs.filter(function(c){return !c.srv;}).concat(fresh);
    if(sig!==convSig){convSig=sig;if(['msgs','chat','account'].indexOf(S.screen)>-1)render(S.screen!=='chat');}

function shopBadge(sh,sz,mk){if(!sh)return '';return '<div class="meta '+(sh.verified?'vbadge':'sbadge')+'">'+svg(sh.verified?I.check:I.shop2,sz,sh.verified?2.5:1.8)+t(sh.verified?'shopVerified':'shopB')+(mk&&sh.market?' · '+esc(sh.market):'')+'</div>';}
function shopList(){var m={};allAds().forEach(function(a){if(!a.shop||!a.shop.name||a.status==='sold')return;var k=a.owner||a.shop.name,x=m[k]||(m[k]={name:a.shop.name,market:a.shop.market||'',verified:!!a.shop.verified,ads:[],t:0,owner:a.owner||'',city:a.city});x.ads.push(a);if(a.t>x.t)x.t=a.t;});
  return Object.keys(m).map(function(k){return m[k];}).sort(function(x,y){return (y.verified-x.verified)||y.ads.length-x.ads.length||y.t-x.t;});}
V.shops=function(){
  var u=S.user,mine=u&&u.shop;var q=norm(S.shq||'');
  var all=shopList(),list=all.filter(function(x){return !q||norm(x.name+' '+x.market+' '+(x.city||'')).indexOf(q)>-1;});
  var cta=mine?'<div class="box shopcta"><div class="avatar" aria-hidden="true">'+esc(mine.name.charAt(0).toUpperCase())+'</div><div style="flex:1;min-width:0"><b>'+esc(mine.name)+'</b><div class="row" style="gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn small primary" data-a="shop" data-v="'+esc(u.id)+'">'+t('myShop')+'</button><button class="btn small" data-a="go" data-s="bulk">'+t('shopAddProd')+'</button></div></div></div>'
    :'<div class="box shopcta" style="flex-direction:column;align-items:stretch;gap:8px"><b style="font-size:17px">'+t('shopsCtaT')+'</b><p class="meta" style="margin:0;line-height:1.5">'+t('shopsCtaP')+'</p><button class="btn primary wide" data-a="pro">'+svg(I.shop2,20)+t('shopsCtaB')+'</button></div>';
  var rows=list.map(function(x){var n=x.ads.length;
    return '<button class="shoprow" data-a="shop" data-v="'+esc(x.owner)+'" data-n="'+esc(x.name)+'"><div class="row" style="gap:12px;align-items:center"><div class="avatar" aria-hidden="true">'+esc(x.name.charAt(0).toUpperCase())+'</div><div style="flex:1;min-width:0;text-align:start"><div class="shopname" translate="no">'+esc(x.name)+'</div>'+
      shopBadge(x,13,true)+'<div class="meta">'+(n===1?t('shopsN1'):t('shopsN').replace('{n}',num(n)))+(x.city?' · '+esc(city(x.city)):'')+'</div></div>'+svg(S.lang==='ar'?I.back:I.chev,20)+'</div>'+
      '<div class="shopthumbs">'+x.ads.slice(0,4).map(function(a){return '<span class="shopth">'+thumb(a)+'</span>';}).join('')+'</div></button>';}).join('');
  return topbar(t('shopsH'),'home')+'<div class="scroll"><div class="sec" style="gap:12px">'+cta+
    (all.length>3?'<label for="shq" class="srh">'+t('shopsSearch')+'</label><input id="shq" class="inp" data-shq="1" value="'+esc(S.shq||'')+'" placeholder="'+t('shopsSearch')+'" style="border-radius:24px">':'')+
    (rows||'<div class="empty" style="padding:24px 0">'+svg(I.shop2,36)+'<div>'+t('shopsNone')+'</div></div>')+'</div></div>';};
function loadShop(){var id=S.shopId;if(!id)return;api('GET','users/'+encodeURIComponent(id)).then(function(d){if(S.shopId!==id)return;S.shopU=d.user;if(S.screen==='shop')render(true);}).catch(function(){if(S.screen==='shop'){S.shopU={missing:1};render(true);}});}
function shopUrl(sh){return location.origin+'/?b='+encodeURIComponent(sh.slug||'');}
V.shop=function(){
  var id=S.shopId,U=S.shopU,back=S.shopBack&&S.shopBack!=='shop'?S.shopBack:'home';
  var list=allAds().filter(function(a){return a.status!=='sold'&&(id?a.owner===id:a.shop&&a.shop.name===S.shopName);});
  if(id&&!U)return topbar(esc(S.shopName||''),back)+'<div class="scroll"><div class="empty">…</div></div>';
  if(U&&U.missing)return topbar('',back)+'<div class="scroll"><div class="empty">'+t('shNotFound')+'</div></div>';
  var sh=(U&&U.shop)||(list[0]&&list[0].shop)||{name:S.shopName||''},mine=S.user&&id&&S.user.id===id;
  var dg=String(sh.wa||'').replace(/\D/g,'').slice(-8);
  var info=[sh.desc?'<p class="shdesc" dir="auto">'+esc(sh.desc)+'</p>':'',
    sh.addr?'<div class="shline">'+svg(I.pin,18)+'<span dir="auto">'+esc(sh.addr)+'</span></div>':'',
    U&&U.city?'<div class="shline">'+svg('<path d="M3 21h18M5 21V8l7-5 7 5v13"/>',18)+'<span>'+esc(city(U.city))+'</span></div>':'',
    sh.hours?'<div class="shline">'+svg(I.clock,18)+'<span dir="auto">'+esc(sh.hours)+'</span></div>':'',
    sh.deliv?'<div class="shline" style="color:var(--brand);font-weight:700">'+svg('<path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',18)+'<span>'+t('shDelivB')+(sh.delivNote?' · <span style="font-weight:400;color:var(--fg)" dir="auto">'+esc(sh.delivNote)+'</span>':'')+'</span></div>':''].join('');
  var rate=U&&U.rating&&U.rating.n?'<div class="meta" style="display:flex;align-items:center;gap:4px;color:var(--fg)">'+svg(I.star.replace('<path','<path fill="#F2B705"'),15,1.4)+'<b>'+String(U.rating.avg).replace('.',S.lang==='ar'?'٫':',')+'</b> · '+tc('revN',U.rating.n)+'</div>':'';
  var btns=(dg?'<div class="row" style="gap:8px"><a class="btn wa" style="flex:1;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/222'+dg+'?text='+encodeURIComponent(t('shHello')+(sh.slug?'\n'+shopUrl(sh):''))+'">'+svg(I.msg,18)+'WhatsApp</a><a class="btn" style="flex:1;text-decoration:none" href="tel:+222'+dg+'">'+svg(I.phone,18)+t('call')+'</a></div>':'')+
    (sh.slug?'<button class="btn wide" data-a="shopshare">'+svg(I.share,18)+t('shShare')+'</button>':'');
  var own=mine?'<div class="box" style="flex-direction:column;align-items:stretch;gap:8px">'+(sh.verified?'':'<p class="meta" style="margin:0">'+svg(I.clock,14)+' '+t('shopPending')+'</p>')+
    '<button class="btn" data-a="shopedit">'+svg('<path d="M4 20h4L19 9l-4-4L4 16z"/>',18)+t('shEdit')+'</button><div class="row" style="gap:8px"><button class="btn primary" style="flex:1" data-a="post">'+t('shopAddOne')+'</button><button class="btn" style="flex:1" data-a="go" data-s="bulk">'+t('shopAddProd')+'</button></div></div>':'';
  return topbar(esc(sh.name),back)+'<div class="scroll"><div class="sec" style="gap:14px">'+
   '<div class="shhead"><div class="bigav shlogo">'+avHTML(sh.name,U&&U.avatar)+'</div><div style="flex:1;min-width:0"><h1 class="uname" style="font-size:22px" translate="no">'+esc(sh.name)+'</h1>'+shopBadge(sh,14,true)+rate+
   '<div class="meta">'+(list.length===1?t('shopsN1'):t('shopsN').replace('{n}',num(list.length)))+'</div></div></div>'+
   (info?'<div class="shinfo">'+info+'</div>':'')+btns+own+
   (list.length?'<div class="grid">'+list.map(card).join('')+'</div>':'')+'</div></div>';};

V.shopedit=function(){

  var F=S.shopForm,O=' <span style="font-weight:400;color:var(--muted);font-size:13px">'+t('optional')+'</span>',cr=!u.shop;

var recM=null,recTick=null;
function recStart(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){toast(t('recNo'));return;}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
    var chunks=[],mt=['audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'].filter(function(m){try{return MediaRecorder.isTypeSupported(m);}catch(e){return false;}})[0];
    var opt={audioBitsPerSecond:32000};if(mt)opt.mimeType=mt;
    try{recM=new MediaRecorder(st,opt);}catch(e){recM=new MediaRecorder(st);}
    recM.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data);};
    recM.onstop=function(){
      st.getTracks().forEach(function(tr){tr.stop();});clearInterval(recTick);S.rec=null;
      var type=(recM.mimeType||mt||'audio/webm'),blob=new Blob(chunks,{type:type});recM=null;
      if(!blob.size){render(true);return;}
      if(blob.size>1500000){toast(t('voiceTooBig'));render(true);return;}
      var r=new FileReader();r.onload=function(){if(S.draft)S.draft.voice=r.result;if(S.screen==='post')render(true);};r.readAsDataURL(blob);};
    recM.start(500);S.rec={start:Date.now()};render(true);
    recTick=setInterval(function(){
      if(!S.rec)return;var sec=Math.floor((Date.now()-S.rec.start)/1000),el=app.querySelector('#rectime');
      if(el)el.textContent=Math.floor(sec/60)+':'+('0'+sec%60).slice(-2);
      if(sec>=60||S.screen!=='post')recStop();},250);
  }).catch(function(){toast(t('recDenied'));});}
function recStop(){if(recM&&recM.state!=='inactive')recM.stop();}
function addVoice(f){
  if(!f||!S.draft)return;
  if(!/^audio\//.test(f.type)&&!/\.(m4a|mp3|aac|ogg|opus|wav|webm|3gp|amr)$/i.test(f.name||'')){toast(t('voiceBad'));return;}
  if(f.size>1500000){toast(t('voiceTooBig'));return;}
  var r=new FileReader();r.onload=function(){S.draft.voice=r.result;render(true);};r.readAsDataURL(f);
}

var FLOW_SKIP={pnext:1,pprev:1,pgo:1,publish:1,rmph:1,cleardraft:1,rmvoice:1,go:1};
function flowItems(){
  var f=app.querySelector('#pf');if(!f)return [];
  var out=[],seen=[];
  Array.prototype.forEach.call(f.querySelectorAll('input.inp, select.inp, textarea.inp, button[data-a]'),function(x){
    if(x.tagName==='BUTTON'){if(FLOW_SKIP[x.getAttribute('data-a')]||/^(more|pnext|pprev|pgo)$/.test(x.getAttribute('data-a'))||x.closest('.pstep[hidden]'))return;var g=x.parentNode;if(seen.indexOf(g)>-1)return;seen.push(g);
      var done=!!g.querySelector('[aria-pressed="true"],[aria-checked="true"],[aria-selected="true"]');out.push({el:g,done:done,kind:'group'});}
    else if(x.offsetParent!==null&&!x.closest('.pstep[hidden]'))out.push({el:x,done:!!String(x.value||'').trim(),kind:x.tagName==='INPUT'||x.tagName==='TEXTAREA'?'text':'select'});});
  return out;}
function absTop(el){var sc=app.querySelector('.scroll');return el.getBoundingClientRect().top+(sc?sc.scrollTop:0);}
function flash(el){el.classList.remove('flowhi');void el.offsetWidth;el.classList.add('flowhi');setTimeout(function(){el.classList.remove('flowhi');},1600);}
function guideTo(item){
  if(!item)return;var el=item.el;
  try{el.scrollIntoView({behavior:'smooth',block:'center'});}catch(e){el.scrollIntoView();}
  flash(item.kind==='group'?(el.closest('.field')||el):el);
  if(item.kind==='text')setTimeout(function(){try{el.focus({preventScroll:true});}catch(e){el.focus();}},350);}
function guideAfter(y){
  var it=flowItems();for(var i=0;i<it.length;i++){var tp=absTop(it[i].el);if(tp>y+8&&!it[i].done){guideTo(it[i]);return;}}}
function guideErr(){
  var el=app.querySelector('#pf .pstep:not([hidden]) [aria-invalid="true"], #pf .pstep:not([hidden]) .err')||app.querySelector('#pf [aria-invalid="true"], #pf .err');if(!el)return;
  var tgt=el.classList.contains('err')?(el.parentNode.querySelector('input.inp,select.inp,textarea.inp')||el.parentNode):el;
  guideTo({el:tgt,kind:tgt.matches&&tgt.matches('input,textarea')?'text':'group'});}
app.addEventListener('keydown',function(e){
  if(e.key!=='Enter'||S.screen!=='post')return;var el=e.target;
  if(!el.matches||!el.matches('#pf input.inp'))return;e.preventDefault();
  var it=flowItems(),y=absTop(el);
  for(var i=0;i<it.length;i++){if(it[i].el!==el&&absTop(it[i].el)>y+4){guideTo(it[i]);if(it[i].kind!=='text')el.blur();return;}}
  el.blur();});
var flowY=null;
app.addEventListener('click',function(e){
  if(S.screen!=='post')return;var b=e.target.closest('#pf button[data-a]');if(!b||FLOW_SKIP[b.getAttribute('data-a')])return;
  flowY=absTop(b);setTimeout(function(){if(flowY!=null&&S.screen==='post'){var y=flowY;flowY=null;guideAfter(y);}},60);},true);
app.addEventListener('change',function(e){
  if(S.screen!=='post')return;var el=e.target;if(!el.matches||!el.matches('#pf select.inp'))return;
  var y=absTop(el);setTimeout(function(){var n=app.querySelector('#'+el.id);guideAfter(n?absTop(n):y);},60);});

(function(){
  // Retour par glissement vers la droite, n'importe où sur l'écran (comme l'application Claude).
  // La page suit le doigt et laisse voir la page précédente en dessous.
  var iosBrowser=/iPad|iPhone|iPod/.test(navigator.userAgent)&&!(navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches));
  var SAFE={home:1,favs:1,msgs:1,account:1,myads:1,user:1,detail:1,searches:1};
  var sx=0,sy=0,dx=0,dy=0,t0=0,state=0,under=null,w=0,rtl=false; // state: 0 rien, 1 en attente, 2 glissement, -1 annulé
  function scrollsX(el){for(var n=el;n&&n!==app;n=n.parentElement){
      if(n.matches&&n.matches('input,textarea,select,video,audio,.hrow,.mchips,.photos,.cattiles,.vbar'))return true;
      var cs=getComputedStyle(n);if((cs.overflowX==='auto'||cs.overflowX==='scroll')&&n.scrollWidth>n.clientWidth+2)return true;}return false;}
  function makeUnder(){
    var b=backButton();if(!b)return;var target=b.getAttribute('data-s')||'home',html='';
    if(SAFE[target]&&V[target]&&target!==S.screen){var keep=S.screen;try{S.screen=target;html=V[target]();}catch(e){html='';}S.screen=keep;}
    var r=app.getBoundingClientRect();under=document.createElement('div');under.className='swunder';under.dir=app.dir;
    under.style.cssText='position:fixed;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+r.height+'px;';
    under.innerHTML='<div class="swin">'+html+'</div><div class="swdim"></div>';document.body.appendChild(under);}
  function clear(){if(under){under.remove();under=null;}app.style.transition='';app.style.transform='';app.style.boxShadow='';app.style.zIndex='';}
  function paint(d){var p=Math.min(1,d/w);app.style.transform='translateX('+(rtl?-d:d)+'px)';
    if(under){under.firstChild.style.transform='translateX('+(rtl?1:-1)*(1-p)*w*0.3+'px)';under.lastChild.style.opacity=String(0.35*(1-p));}}
  app.addEventListener('touchstart',function(e){
    state=0;if(e.touches.length!==1||S.sheet||S.fsheet||S.viewImg||S.langPick||!backButton())return;
    var x=e.touches[0].clientX,r=app.getBoundingClientRect();rtl=S.lang==='ar';w=r.width;
    if(iosBrowser&&!rtl&&x-r.left<24)return; // bord gauche de Safari (français) : laissé au geste de Safari
    if(scrollsX(e.target))return;
    sx=x;sy=e.touches[0].clientY;dx=dy=0;t0=Date.now();state=1;},{passive:true});
  app.addEventListener('touchmove',function(e){
    if(state<1)return;var x=e.touches[0].clientX,y=e.touches[0].clientY;dx=rtl?sx-x:x-sx;dy=y-sy;
    if(state===1){
      if(Math.abs(dy)>10&&Math.abs(dy)>=Math.abs(dx)*0.8){state=-1;return;}   // défilement vertical
      if(dx<-10){state=-1;return;}                                         // glissement dans l'autre sens
      if(dx>14&&dx>Math.abs(dy)*1.6){state=2;makeUnder();app.style.zIndex='2';app.style.transition='none';app.style.boxShadow='-10px 0 30px rgba(0,0,0,.18)';}
      else return;}
    if(state===2)paint(Math.max(0,dx));},{passive:true});
  function end(){
    if(state!==2){state=0;return;}state=0;var v=dx/Math.max(1,Date.now()-t0);
    if(dx>w*0.33||(v>0.55&&dx>40)){app.style.transition='transform .18s ease-out';paint(w);
      if(under){under.firstChild.style.transition='transform .18s ease-out';under.lastChild.style.transition='opacity .18s';}
      setTimeout(function(){var b=backButton();app.style.transition='none';app.style.transform='';app.style.boxShadow='';if(b)b.click();setTimeout(clear,30);},180);}
    else{app.style.transition='transform .2s ease-out';paint(0);if(under){under.firstChild.style.transition='transform .2s ease-out';under.lastChild.style.transition='opacity .2s';}setTimeout(clear,210);}}
  app.addEventListener('touchend',end);
  /* Safari sur iPhone a son propre glissement depuis les bords (gauche = retour, droite = suivant).
     On le bloque sur le côté qui ne correspond pas à la langue ; un simple toucher reste un clic. */
  if(iosBrowser){var eg=null;
    document.addEventListener('touchstart',function(e){eg=null;if(e.touches.length!==1)return;var x=e.touches[0].clientX,W=window.innerWidth,ar=S.lang==='ar';
      if((ar&&x<22)||x>W-22){e.preventDefault();eg={x:x,y:e.touches[0].clientY,t:Date.now(),el:e.target};}},{passive:false,capture:true});
    document.addEventListener('touchend',function(e){if(!eg)return;var c=e.changedTouches[0],g=eg;eg=null;
      if(Math.abs(c.clientX-g.x)<10&&Math.abs(c.clientY-g.y)<10&&Date.now()-g.t<600){var el=g.el&&g.el.closest?g.el.closest('input,textarea,select,button,a,label,[data-a]'):null;
        if(el&&/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName))el.focus();else if(el)el.click();}},{capture:true});}
  app.addEventListener('touchcancel',function(){if(state===2){app.style.transition='transform .2s';paint(0);setTimeout(clear,210);}state=0;});
})();

/* ---------- Clavier : l'écran se réduit au-dessus du clavier et le champ reste visible ---------- */
(function(){
  var vv=window.visualViewport,maxH=window.innerHeight;
  function fit(){
    if(!vv)return;var full=window.innerHeight,h=vv.height;
    if(window.innerWidth<600){document.documentElement.style.setProperty('--vvh',Math.round(h)+'px');if(vv.offsetTop)window.scrollTo(0,0);}
    if(!document.activeElement||!/INPUT|TEXTAREA/.test(document.activeElement.tagName))maxH=Math.max(maxH,full,h);
    var open=Math.max(maxH,full)-h>140;
    app.classList.toggle('kbd',!!open&&window.innerWidth<600);
    showField();}
  function showField(){
    var el=document.activeElement;if(!el||!app.contains(el)||!/INPUT|TEXTAREA/.test(el.tagName))return;
    if(el.id==='chatin'){var sc=app.querySelector('.scroll');if(sc)sc.scrollTop=sc.scrollHeight;return;}
    var r=el.getBoundingClientRect(),top=vv?vv.offsetTop:0,bottom=(vv?vv.height:window.innerHeight)+top;
    if(r.top<top+70||r.bottom>bottom-20){try{el.scrollIntoView({block:'center',behavior:'smooth'});}catch(e){el.scrollIntoView();}}}
  if(vv){vv.addEventListener('resize',fit);vv.addEventListener('scroll',function(){if(vv.offsetTop&&window.innerWidth<600)window.scrollTo(0,0);});}
  app.addEventListener('focusin',function(e){if(!/INPUT|TEXTAREA/.test(e.target.tagName)||e.target.type==='file'||e.target.type==='checkbox')return;
    setTimeout(fit,60);setTimeout(showField,320);setTimeout(showField,650);});
  app.addEventListener('focusout',function(){setTimeout(fit,120);});
  fit();
})();
